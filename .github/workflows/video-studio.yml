name: Video Studio tests

on:
  push:
    branches:
      - main
      - feat/auto-video-production
    paths:
      - 'plugins/dsh-video-studio/**'
      - '.github/workflows/video-studio.yml'
  pull_request:
    paths:
      - 'plugins/dsh-video-studio/**'
      - '.github/workflows/video-studio.yml'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
      # index.js imports @deepseek-ai/schemastery for the Config schema, so the
      # suite no longer runs straight off a fresh checkout.
      - name: Install plugin dependencies
        working-directory: plugins/dsh-video-studio
        run: npm ci --no-audit --no-fund
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Run plugin tests
        working-directory: plugins/dsh-video-studio
        run: npm test
